# Production-oriented single-node LiveKit SFU configuration. The compose
# init service writes the private key_file from .env at container startup.
port: 7880
log_level: info
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # Set false only when every participant is on the Docker host/LAN.
  use_external_ip: true
redis:
  address: redis:6379
key_file: /run/hitsync-livekit/keys.txt
