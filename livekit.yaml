# Production-oriented single-node LiveKit SFU configuration. The compose
# init service writes the private key_file from .env at container startup.
#
# tcp_port and the UDP port_range must stay in sync with the host port
# mappings in docker-compose.yml. They're deliberately off the LiveKit
# defaults (7881 / 50000-50100) so a second, independently-deployed LiveKit
# instance on the same host doesn't collide with this one.
port: 7880
logging:
  level: info
rtc:
  tcp_port: 7883
  port_range_start: 51000
  port_range_end: 51100
  # Set false only when every participant is on the Docker host/LAN.
  use_external_ip: true
redis:
  address: redis:6379
key_file: /run/hitsync-livekit/keys.txt
