name: hitsync

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
  internal:
    driver: bridge

volumes:
  pgdata:
  mediacache:
  livekitconfig:

services:
  livekit-config:
    image: busybox:1.37
    restart: "no"
    env_file: [.env]
    command: ["sh", "-ec", "printf '%s: %s\\n' \"$$LIVEKIT_API_KEY\" \"$$LIVEKIT_API_SECRET\" > /config/keys.txt"]
    volumes: [livekitconfig:/config]
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { memory: 128M }

  livekit:
    image: livekit/livekit:v1.8.3
    restart: unless-stopped
    command: --config /etc/livekit/livekit.yaml
    env_file: [.env]
    depends_on:
      redis: { condition: service_healthy }
      livekit-config: { condition: service_completed_successfully }
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
      - livekitconfig:/run/hitsync-livekit
    ports:
      # WebRTC media must reach the SFU directly; Traefik only proxies 7880.
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    networks: [internal, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.hitsync-livekit.rule=Host(`${LIVEKIT_DOMAIN}`)
      - traefik.http.routers.hitsync-livekit.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.hitsync-livekit.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.hitsync-livekit.loadbalancer.server.port=7880

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hitsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-hitsync}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hitsync}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512M }

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
      livekit: { condition: service_started }
    networks: [internal, proxy]
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 512M, cpus: "2" }
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.hitsync-api.rule=Host(`${APP_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/ws`))
      - traefik.http.routers.hitsync-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.hitsync-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.hitsync-api.priority=20
      - traefik.http.services.hitsync-api.loadbalancer.server.port=8080

  media:
    build: ./media
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      livekit: { condition: service_started }
    volumes: [mediacache:/cache]
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 256M, cpus: "1" }

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
    networks: [proxy]
    deploy:
      resources:
        limits: { memory: 128M }
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.hitsync-web.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.hitsync-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.hitsync-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.hitsync-web.priority=10
      - traefik.http.services.hitsync-web.loadbalancer.server.port=80
